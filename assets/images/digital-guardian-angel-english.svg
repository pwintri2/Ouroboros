  <text x="683" y="674" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="29" font-weight="500" fill="#ffffff" filter="url(#textShadow)">
    <tspan x="683" dy="0">Ouroboros AI is a private helper that quietly makes technology safer, calmer,</tspan>
    <tspan x="683" dy="36">and easier to understand while keeping personal information close to home.</tspan>
