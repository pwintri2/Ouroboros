<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Wintrip Regiekamer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/wintrip.css">
</head>
<body class="bg-gray-950 text-gray-100 font-sans" style="font-family:Inter,system-ui,-apple-system;">
  <div id="app" class="h-screen flex">
    <!-- Sidebar -->
    <div id="sidebar" class="w-56 bg-gray-900 border-r border-gray-800 p-3">
      <div class="flex items-center gap-2 mb-4">
        <img src="/static/img/wintrip-logo.svg" class="w-8 h-8" alt="Wintrip">
        <div class="text-sm font-semibold">Wintrip AI</div>
      </div>
      <nav id="nav-items" class="space-y-2 text-sm">
        <button data-view="meeting" class="w-full text-left px-2 py-2 rounded hover:bg-gray-800">Vergadertafel</button>
        <button data-view="team" class="w-full text-left px-2 py-2 rounded hover:bg-gray-800">IT Team</button>
        <button data-view="personas" class="w-full text-left px-2 py-2 rounded hover:bg-gray-800">Persona's beheer</button>
        <button data-view="projects" class="w-full text-left px-2 py-2 rounded hover:bg-gray-800">Projecten</button>
        <div class="border-t border-gray-800 mt-3 pt-3">
          <button id="new-chat" class="w-full text-left px-2 py-2 rounded bg-cyan-600 text-black font-semibold">+ Nieuwe Chat</button>
        </div>
      </nav>
      <div id="chat-list" class="mt-4 overflow-auto text-xs"></div>
    </div>

    <!-- Main -->
    <div id="main" class="flex-1 flex flex-col">
      <!-- Top bar -->
      <div class="h-14 flex items-center justify-between px-4 border-b border-gray-800">
        <div class="flex items-center gap-2">
          <div id="model-badges" class="flex gap-2"></div>
        </div>
        <div>
          <button id="apis" class="px-3 py-1 bg-gray-800 rounded">API's</button>
        </div>
      </div>

      <!-- Content area -->
      <div id="content" class="flex-1 p-4 overflow-hidden">
        <div id="tabs" class="mb-3">Tabblad: <span id="active-tab">Chat</span></div>
        <div id="chat-window" class="bg-gray-900 rounded h-[70vh] p-4 overflow-auto">
          <div id="messages" class="space-y-3"></div>
        </div>
        <div id="composer" class="mt-3 flex items-center gap-3">
          <button class="p-2 bg-gray-800 rounded">📎</button>
          <button class="p-2 bg-gray-800 rounded" disabled>🎤</button>
          <div class="flex-1">
            <textarea id="input" class="w-full resize-none rounded p-2 bg-gray-800 h-12" placeholder="Type hier..."></textarea>
          </div>
          <button id="send" class="px-4 py-2 bg-cyan-500 text-black rounded">➤</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
