services:
  chroma:
    image: chromadb/chroma:0.5.23
    restart: unless-stopped
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "8000:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 30

  ouroboros:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      chroma:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - CHROMA_COLLECTION=ouroboros_11d_hippocampus
      - CHROMA_PERSIST_DIR=/workspace/data/chromadb
      - CHROMA_TENANT=default_tenant
      - CHROMA_DATABASE=default_database
      - CHROMA_SSL=false
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      - BROWSER_HEADLESS=true
      - MAX_SEED_TOPICS=0
      - STEPS_PER_TOPIC=3
      - VISION_PROVIDER=local_stub
      - GORDON_PROGRESS_FILE=/workspace/gordon_progress.log
    volumes:
      - .:/workspace
      - ./data:/workspace/data
    ports:
      - "7860:7860"
    command:
      - /bin/sh
      - -lc
      - |
        python -m resonant_ouroboros.main learn-seed --seed "/workspace/agi_kennis.txt" --max-topics "$${MAX_SEED_TOPICS:-0}" --steps-per-topic "$${STEPS_PER_TOPIC:-3}" &
        python -m resonant_ouroboros.main dashboard

volumes:
  chroma_data:
