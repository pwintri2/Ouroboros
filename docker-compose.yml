services:
  wintrip:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wintrip_ai
    working_dir: /app
    volumes:
      - ./wintrip_brain:/app/wintrip_brain:rw
      - ./data:/app/data:rw
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - WINTRIP_GEMINI_CLI=/usr/local/bin/gemini
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3); sys.exit(0)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
  tunnel:
    image: cloudflare/cloudflared:2024.12.0
    container_name: wintrip_tunnel
    command: tunnel --url http://wintrip_ai:8000
    depends_on:
      - wintrip
    restart: unless-stopped
