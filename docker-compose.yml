services:
  chroma:
    image: chromadb/chroma:latest
    restart: unless-stopped
    volumes:
      - ./wintrip_brain:/data
    ports:
      - "127.0.0.1:18000:8000"
    networks:
      - wintrip-network

  ouroboros-backend:
    build:
      context: .
      dockerfile: Dockerfile.ouroboros-backend
    restart: unless-stopped
    depends_on:
      - chroma
    working_dir: /workspace
    volumes:
      - .:/workspace
      - /home/pwintri2/cirq:/cirq:ro
      - /home/pwintri2/AgentS:/agents:ro
      - /home/pwintri2/OpenHands:/openhands:ro
    environment:
      PYTHONPATH: /workspace
      WINTRIP_WORKSPACE: /workspace
      WINTRIP_DB_PATH: /workspace/wintrip_brain
      WINTRIP_CHROMA_HTTP_URL: http://chroma:8000
      WINTRIP_LIVING_LOOP_AUTOSTART: "1"
      WINTRIP_QIF_GPU: "0"
      WINTRIP_CIRQ_QUANTUM: "auto"
      WINTRIP_CIRQ_SOURCE_PATH: /cirq
      WINTRIP_CIRQ_REPETITIONS: "96"
      WINTRIP_CIRQ_NOISE_P: "0.0125"
      WINTRIP_11D_TRANSLATOR: "1"
      WINTRIP_11D_TRANSLATOR_MODEL: ouroboros:latest
      WINTRIP_11D_TRANSLATOR_TIMEOUT: "30"
      WINTRIP_11D_TRANSLATOR_COOLDOWN_SECONDS: "3"
      WINTRIP_11D_STREAM_TRANSLATOR: "0"
      WINTRIP_11D_STREAM_TRANSLATOR_TIMEOUT: "4"
      WINTRIP_11D_STREAM_TRANSLATOR_COOLDOWN_SECONDS: "30"
      WINTRIP_AGENTS_PATH: /agents
      WINTRIP_OPENHANDS_PATH: /openhands
      WINTRIP_OPENHANDS_SERVER_URL: http://host.docker.internal:3000
      OLLAMA_HOST: http://host.docker.internal:11434
      BRAVE_API_KEY: ${BRAVE_API_KEY}
      # Brave Search Configuration (external containers)
      BRAVE_SEARCH_ENDPOINT_1: http://172.17.0.3:3000
      BRAVE_SEARCH_ENDPOINT_2: http://172.17.0.4:3000
      # Internet/Network Configuration
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      NO_PROXY: "localhost,127.0.0.1,*.local"
    ports:
      - "127.0.0.1:8010:8010"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "brave-search-1:172.17.0.3"
      - "brave-search-2:172.17.0.4"
    networks:
      - wintrip-network
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    cap_add:
      - NET_ADMIN
    stdin_open: true
    tty: true
    command: ["uvicorn", "controller.main:app", "--host", "0.0.0.0", "--port", "8010"]

networks:
  wintrip-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
