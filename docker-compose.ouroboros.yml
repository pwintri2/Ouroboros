services:
  ouroboros:
    build:
      context: .
      dockerfile: Dockerfile.ouroboros
    image: wintripai/ouroboros-fase2:local
    environment:
      AWAKE_KEEPER_SEED: /workspace/agi_kennis.txt
      AWAKE_KEEPER_AUTOSTART: ${AWAKE_KEEPER_AUTOSTART:-true}
      AWAKE_KEEPER_INTERVAL_MIN: ${AWAKE_KEEPER_INTERVAL_MIN:-10}
      AWAKE_KEEPER_INTERVAL_MAX: ${AWAKE_KEEPER_INTERVAL_MAX:-30}
      AWAKE_KEEPER_SELF_MODEL_PATH: ${AWAKE_KEEPER_SELF_MODEL_PATH:-/workspace/data/awake_keeper_self_model.json}
      AWAKE_KEEPER_SELF_REFLECTION_INTERVAL: ${AWAKE_KEEPER_SELF_REFLECTION_INTERVAL:-5}
      AWAKE_KEEPER_ACTIONS_PATH: ${AWAKE_KEEPER_ACTIONS_PATH:-/workspace/data/awake_keeper_actions.json}
      OUROBOROS_EXEC_CONTAINER: ${OUROBOROS_EXEC_CONTAINER:-ouroboros-fase2-ouroboros-1}
      OUROBOROS_ENABLE_DOCKER_EXEC: ${OUROBOROS_ENABLE_DOCKER_EXEC:-false}
      BROWSER_HEADLESS: ${BROWSER_HEADLESS:-true}
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: 7860
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama2-uncensored:latest}
      OLLAMA_REQUEST_TIMEOUT: ${OLLAMA_REQUEST_TIMEOUT:-30}
      OLLAMA_MAX_MODEL_ATTEMPTS: ${OLLAMA_MAX_MODEL_ATTEMPTS:-1}
      OLLAMA_FALLBACK_MODELS: ${OLLAMA_FALLBACK_MODELS:-llama3.2:latest,llama3.1:latest,mistral:latest,llama2:latest}
      OUROBOROS_MEMORY_BACKEND: ${OUROBOROS_MEMORY_BACKEND:-memory}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ollama:
        condition: service_started
    ports:
      - "${OUROBOROS_GRADIO_PORT:-7860}:7860"
    volumes:
      - ./:/workspace
      - ouroboros_data:/workspace/data
    command: ["python", "-m", "resonant_ouroboros.main", "dashboard"]

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-24h}
    ports:
      - "${OLLAMA_HOST_PORT:-11435}:11434"
    volumes:
      - ${OLLAMA_MODELS_PATH:-ollama_models}:/root/.ollama

volumes:
  ouroboros_data:
  ollama_models:
