# setup.cfg
# Phase 7.X — Wintrip AI project configuratie
# Wintrip AI | task_id: wintrip-soc-007

[flake8]
max-line-length = 120
extend-ignore =
    # E203: whitespace before ':' (black-compatibel)
    E203,
    # W503: line break before binary operator (PEP8 stijl)
    W503,
    # E501: line too long — afgehandeld via max-line-length
    E501
exclude =
    __pycache__,
    .git,
    .github,
    *.egg-info,
    build,
    dist,
    data/,
    wintrip_brain/,
    backups/,
    output/,
    sandbox/
per-file-ignores =
    # Tests mogen langere regels en ongebruikte imports hebben
    sandbox_tests/*.py: F401,E501
