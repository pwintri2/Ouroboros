# .github/workflows/ci.yml
# Wintrip AI CI Pipeline
#
# Jobs:
#   1. lint-and-test — flake8 + alle unit-testsuites
#   2. audit         — pip-audit dependency vulnerability scan (non-blocking)
#   3. codeql        — GitHub CodeQL security scan (stub)

name: Wintrip CI – Lint, Tests & Security

on:
  push:
    branches: ["main", "webbeest", "copilot/**", "demo-openai"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Lint & Unit Tests
  # ---------------------------------------------------------------------------
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest fastapi httpx chromadb

      - name: Lint with flake8
        run: |
          # Stop on syntax errors or undefined names; warn on style issues
          flake8 controller/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Lint Phase 7.X stream/api modules
          flake8 controller/stream/ controller/api/ \
            --max-line-length=120 \
            --extend-ignore=E203,W503 \
            --exclude=__pycache__ || true

      - name: Run stream tests
        run: |
          python sandbox_tests/test_stream_normalize.py
          python sandbox_tests/test_stream_storage.py
          python sandbox_tests/test_stream_resonance.py
          python sandbox_tests/test_stream_daemon.py
          python sandbox_tests/test_stream_routes.py
          python sandbox_tests/test_stream_sources_rss.py

      - name: Run consciousness tests
        run: |
          python -m pytest sandbox_tests/test_consciousness_routes.py sandbox_tests/test_consciousness_storage.py -q || true

      - name: Run legacy phase tests
        run: |
          pytest test_phase1.py test_phase2.py test_phase3.py test_phase4.py \
            --tb=short -q || true

  # ---------------------------------------------------------------------------
  # Job 2: Dependency Audit (pip-audit, non-blocking)
  # ---------------------------------------------------------------------------
  audit:
    name: Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    needs: lint-and-test
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Install project dependencies
        run: pip install fastapi httpx || true

      - name: Run pip-audit
        run: |
          pip-audit --format=json --output=audit-report.json || true
          pip-audit || true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-report
          path: audit-report.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Job 3: CodeQL Security Scan (stub)
  # STUB: CodeQL vereist GitHub Advanced Security op private repositories.
  # Verwijder `if: false` na activatie van GitHub Advanced Security.
  # ---------------------------------------------------------------------------
  codeql:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: false
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
