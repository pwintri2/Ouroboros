name: Sponsor Scout

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum aantal kandidaten"
        required: false
        default: "25"
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  scout:
    name: Maak sponsor-shortlist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Match the project minimum supported Python version (README: Python 3.10+).
          python-version: "3.10"

      - name: Generate sponsor report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIMIT: ${{ github.event.inputs.limit || '25' }}
        run: |
          python scripts/sponsor_scout.py --limit "$LIMIT" --output sponsor-scout-report.md

      - name: Upload sponsor report
        uses: actions/upload-artifact@v4
        with:
          name: sponsor-scout-report
          path: sponsor-scout-report.md
